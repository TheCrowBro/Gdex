# The browser specs (tests/specs) on every push and pull request, and on demand. They run Tourbook in Chromium with
# Playwright against a local copy of the site, twice side by side: with licences off, as the repository is until the
# owner switches them on, and with TOURBOOK_LICENCE=on, where the test server serves them as live on localhost and every
# spec starts inside free days already under way (tests/lib.mjs, tests/helpers.cjs). The run also fails when the
# offline file list in sw.js is out of date (a file added or removed without running node tools/stamp-build.mjs --dev).
# The desktop job runs the desktop app's smoke test (tests/desktop.mjs) under xvfb on pull requests, by hand, and on
# pushes that change desktop/, package.json, its lock, the smoke test or this file.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: web (licences ${{ matrix.licence }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        licence: ['off', 'on'] # quoted: some YAML readers take bare on and off for true and false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: The licence server's runtime, for its specs (Wrangler and Miniflare)
        if: hashFiles('cloudflare/package-lock.json') != ''
        run: npm ci --prefix cloudflare
      - run: npx playwright install --with-deps chromium
      - name: The offline file list is up to date
        run: |
          node tools/stamp-build.mjs --dev
          git diff --exit-code -- sw.js js/version.js || { echo "::error::Run node tools/stamp-build.mjs --dev and commit sw.js"; exit 1; }
      - run: npm test
        env:
          TOURBOOK_LICENCE: ${{ matrix.licence }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: test-output-${{ matrix.licence }}
          path: tests/output
          if-no-files-found: ignore
  desktop:
    # The desktop app's smoke test (tests/desktop.mjs) under a virtual screen: on pull requests, by hand, and on pushes
    # that change the desktop app (desktop/, package.json, its lock, the smoke test or this workflow). Electron itself is
    # downloaded only here (the web job skips it).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Did the desktop app change?
        id: changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            # a push that changed none of these skips it; anything unclear (a new branch, a forced push) runs it
            if changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA"); then
              echo "$changed" | grep -qE '^(desktop/|package(-lock)?\.json$|tests/desktop\.mjs$|\.github/workflows/tests\.yml$)' || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "The desktop app did not change in this push: its smoke test is skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.changed.outputs.run == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
        if: steps.changed.outputs.run == 'true'
      - run: xvfb-run -a npm run test:desktop
        if: steps.changed.outputs.run == 'true'
